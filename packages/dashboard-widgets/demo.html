<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<title>@poramet-bit/dashboard-widgets — demo</title>
<link rel="stylesheet" href="./dist/styles.css" />
<style>
  body {
    margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--text-primary); font-size: 13px; line-height: 1.6;
  }
  #root { max-width: 1240px; margin: 0 auto; padding: 28px 24px 64px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.sub { font-size: 12.5px; color: var(--text-secondary); margin: 0 0 22px; }
</style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?external=react"
  }
}
</script>
</head>
<body>
<div id="root">Loading…</div>
<script type="module">
  import React from "react";
  import { createRoot } from "react-dom/client";
  import { DashboardGrid } from "./dist/index.js";

  const CONFIG_URL = "../../templates/examples/dashboard_layout.example.json";

  function App({ config }) {
    return React.createElement(
      React.Fragment,
      null,
      React.createElement("h1", null, config.title),
      config.subtitle && React.createElement("p", { className: "sub" }, config.subtitle),
      React.createElement(DashboardGrid, { widgets: config.widgets })
    );
  }

  fetch(CONFIG_URL)
    .then(r => r.json())
    .then(config => {
      createRoot(document.getElementById("root")).render(React.createElement(App, { config }));
    })
    .catch(err => {
      document.getElementById("root").textContent = "Failed to load config: " + err;
    });
</script>
</body>
</html>
