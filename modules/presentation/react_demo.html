<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<title>ICT Budget 2569 — React template demo</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
<style>
  :root {
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --page:           #f9f9f7;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --gridline:       #e1e0d9;
    --baseline:       #c3c2b7;
    --border:         rgba(11,11,11,0.10);
    --series-1:       #2a78d6; /* งบประมาณต้นปี */
    --series-2:       #eb6834; /* งบที่ใช้ไป */
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --surface-1:      #1a1a19;
      --page:           #0d0d0d;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --gridline:       #2c2c2a;
      --baseline:       #383835;
      --border:         rgba(255,255,255,0.10);
      --series-1:       #3987e5;
      --series-2:       #d95926;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-1:      #1a1a19;
    --page:           #0d0d0d;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --gridline:       #2c2c2a;
    --baseline:       #383835;
    --border:         rgba(255,255,255,0.10);
    --series-1:       #3987e5;
    --series-2:       #d95926;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page);
    color: var(--text-primary);
  }
  #root { max-width: 1080px; margin: 0 auto; padding: 32px 20px 64px; }

  .note {
    font-size: 13px;
    color: var(--text-secondary);
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    margin-bottom: 24px;
    line-height: 1.6;
  }
  .note code { font-size: 12px; }

  h1 { font-size: 18px; margin: 0 0 4px; }
  .subtitle { font-size: 13px; color: var(--text-secondary); margin: 0 0 20px; }

  .card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .card h2 {
    font-size: 14px;
    margin: 0 0 14px;
    color: var(--text-primary);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .phase-tag {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: 99px;
    color: var(--text-secondary);
    border: 1px solid var(--border);
  }

  table { width: 100%; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  th, td { border-bottom: 1px solid var(--gridline); padding: 7px 8px; text-align: left; white-space: nowrap; }
  th { color: var(--text-muted); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: 0.02em; }
  td.num, th.num { text-align: right; }
  .table-scroll { max-height: 360px; overflow: auto; }
  .table-scroll table td, .table-scroll table th { position: relative; }
  .table-scroll thead th { position: sticky; top: 0; background: var(--surface-1); }

  .legend { display: flex; gap: 16px; margin-bottom: 10px; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-secondary); }
  .swatch { width: 10px; height: 10px; border-radius: 2px; }

  .chart-wrap { position: relative; }
  .axis-label { fill: var(--text-muted); font-size: 10px; }
  .gridline { stroke: var(--gridline); stroke-width: 1; }
  .baseline { stroke: var(--baseline); stroke-width: 1; }

  .tooltip {
    position: absolute;
    pointer-events: none;
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 12px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.18);
    max-width: 240px;
    line-height: 1.5;
    z-index: 10;
  }
  .tooltip .t-title { font-weight: 600; margin-bottom: 2px; }
  .tooltip .t-row { display: flex; justify-content: space-between; gap: 12px; color: var(--text-secondary); }

  .loading {
    font-size: 12.5px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 40px 0;
    justify-content: center;
  }
  .spinner {
    width: 12px; height: 12px;
    border-radius: 50%;
    border: 2px solid var(--gridline);
    border-top-color: var(--series-1);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .truncate-note { font-size: 11px; color: var(--text-muted); margin-top: 8px; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/plain" id="app-src">
const { useState, useEffect, useRef } = React;

const TABLE_URL = "../../templates/examples/ict_budget_2569.table.json";
const CHART_TOP_N = 12;

function fmtCurrency(n) {
  return new Intl.NumberFormat("th-TH", { maximumFractionDigits: 0 }).format(n);
}
function fmtCompact(n) {
  if (Math.abs(n) >= 1_000_000) return (n / 1_000_000).toFixed(1).replace(/\.0$/, "") + "M";
  if (Math.abs(n) >= 1_000) return Math.round(n / 1_000) + "k";
  return String(n);
}

// Simulates the ai_layer/mcp_server round trip: fetch the raw table template
// (fast — this is what the user sees first), then a "sub agent" derives a
// bar_chart-shaped template from it on a delay. Mirrors the two-phase
// render idea from skip.md: table first, chart from a sub agent after.
function useBudgetData() {
  const [table, setTable] = useState(null);
  const [chart, setChart] = useState(null);
  const [chartPending, setChartPending] = useState(false);

  useEffect(() => {
    fetch(TABLE_URL).then(r => r.json()).then(tpl => {
      setTable(tpl);
      setChartPending(true);
      // sub agent phase: derive bar_chart template from the same rows
      setTimeout(() => {
        const ranked = [...tpl.rows]
          .map(r => ({ ...r, total: r.planned + r.actual }))
          .sort((a, b) => b.total - a.total)
          .slice(0, CHART_TOP_N);
        setChart({
          type: "bar",
          title: `งบประมาณต้นปี vs งบที่ใช้ไป — ${CHART_TOP_N} โครงการงบสูงสุด`,
          labels: ranked.map(r => r.code),
          datasets: [
            { label: "งบประมาณต้นปี", data: ranked.map(r => r.planned), backgroundColor: "var(--series-1)" },
            { label: "งบที่ใช้ไป", data: ranked.map(r => r.actual), backgroundColor: "var(--series-2)" },
          ],
          meta: { names: ranked.map(r => r.name), row_count: ranked.length, dropped: tpl.rows.length - ranked.length },
        });
        setChartPending(false);
      }, 700);
    });
  }, []);

  return { table, chart, chartPending };
}

function BudgetTable({ tpl }) {
  return (
    <div className="table-scroll">
      <table>
        <thead>
          <tr>
            {tpl.columns.map(c => (
              <th key={c.key} className={c.format === "currency" ? "num" : ""}>{c.label}</th>
            ))}
          </tr>
        </thead>
        <tbody>
          {tpl.rows.map(r => (
            <tr key={r.code}>
              {tpl.columns.map(c => (
                <td key={c.key} className={c.format === "currency" ? "num" : ""}>
                  {c.format === "currency" ? fmtCurrency(r[c.key]) : r[c.key]}
                </td>
              ))}
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

function BarChart({ tpl }) {
  const [hover, setHover] = useState(null); // { x, y, groupIdx, seriesIdx }
  const wrapRef = useRef(null);

  const width = 900, height = 340;
  const marginLeft = 52, marginRight = 12, marginTop = 12, marginBottom = 40;
  const plotW = width - marginLeft - marginRight;
  const plotH = height - marginTop - marginBottom;

  const maxVal = Math.max(1, ...tpl.datasets.flatMap(d => d.data));
  const niceMax = Math.ceil(maxVal / 300000) * 300000;
  const gridSteps = 5;

  const n = tpl.labels.length;
  const groupW = plotW / n;
  const seriesCount = tpl.datasets.length;
  const groupGap = 6;   // gap between groups
  const barGap = 2;     // gap between bars within a group
  const barW = (groupW - groupGap - barGap * (seriesCount - 1)) / seriesCount;

  const yFor = v => plotH - (v / niceMax) * plotH;

  return (
    <div className="chart-wrap" ref={wrapRef}>
      <div className="legend">
        {tpl.datasets.map((d, i) => (
          <div className="legend-item" key={d.label}>
            <span className="swatch" style={{ background: d.backgroundColor }} />
            {d.label}
          </div>
        ))}
      </div>
      <svg viewBox={`0 0 ${width} ${height}`} width="100%" role="img" aria-label={tpl.title}>
        <g transform={`translate(${marginLeft},${marginTop})`}>
          {Array.from({ length: gridSteps + 1 }).map((_, i) => {
            const v = (niceMax / gridSteps) * i;
            const y = yFor(v);
            return (
              <g key={i}>
                <line x1={0} x2={plotW} y1={y} y2={y} className="gridline" />
                <text x={-8} y={y} textAnchor="end" dominantBaseline="middle" className="axis-label">
                  {fmtCompact(v)}
                </text>
              </g>
            );
          })}
          <line x1={0} x2={plotW} y1={plotH} y2={plotH} className="baseline" />

          {tpl.labels.map((label, gi) => {
            const gx = gi * groupW;
            return (
              <g key={label}>
                {tpl.datasets.map((d, si) => {
                  const v = d.data[gi];
                  const y = yFor(v);
                  const h = plotH - y;
                  const x = gx + si * (barW + barGap);
                  const isHover = hover && hover.groupIdx === gi && hover.seriesIdx === si;
                  return (
                    <rect
                      key={d.label}
                      x={x}
                      y={y}
                      width={barW}
                      height={Math.max(h, 0)}
                      rx={4}
                      fill={d.backgroundColor}
                      opacity={isHover ? 1 : 0.92}
                      onMouseEnter={(e) => {
                        const box = wrapRef.current.getBoundingClientRect();
                        setHover({
                          groupIdx: gi, seriesIdx: si,
                          x: e.clientX - box.left + 12,
                          y: e.clientY - box.top + 12,
                        });
                      }}
                      onMouseMove={(e) => {
                        const box = wrapRef.current.getBoundingClientRect();
                        setHover(h2 => h2 && { ...h2, x: e.clientX - box.left + 12, y: e.clientY - box.top + 12 });
                      }}
                      onMouseLeave={() => setHover(null)}
                    />
                  );
                })}
                <text
                  x={gx + groupW / 2 - groupGap / 2}
                  y={plotH + 16}
                  textAnchor="middle"
                  className="axis-label"
                >
                  {label.slice(-4)}
                </text>
              </g>
            );
          })}
        </g>
      </svg>

      {hover && (
        <div className="tooltip" style={{ left: hover.x, top: hover.y }}>
          <div className="t-title">{tpl.labels[hover.groupIdx]} — {tpl.meta.names[hover.groupIdx]}</div>
          {tpl.datasets.map((d, si) => (
            <div className="t-row" key={d.label}>
              <span>{d.label}</span>
              <span>฿{fmtCurrency(d.data[hover.groupIdx])}</span>
            </div>
          ))}
        </div>
      )}

      {tpl.meta.dropped > 0 && (
        <div className="truncate-note">
          แสดง {tpl.meta.row_count} โครงการงบสูงสุดจากทั้งหมด {tpl.meta.row_count + tpl.meta.dropped} โครงการ — ดูรายการทั้งหมดในตารางด้านบน
        </div>
      )}
    </div>
  );
}

function App() {
  const { table, chart, chartPending } = useBudgetData();

  return (
    <div>
      <h1>งบประมาณคณะ ICT ปีงบประมาณ 2569</h1>
      <p className="subtitle">Mockup: template JSON → React presentation layer, per templates/table.schema.json + templates/bar_chart.schema.json</p>

      <div className="note">
        แนวคิดจาก skip.md: เฟส 1 render ตาราง (prompt table) ทันทีจาก data_layer/mcp_server —
        ผู้ใช้เห็นคำตอบเร็ว เฟส 2 sub agent แปลงชุดข้อมูลเดียวกันเป็น <code>bar_chart</code> template
        แล้ว render กราฟตามหลัง ไม่บล็อก latency ของเฟส 1
      </div>

      <div className="card">
        <h2>ตาราง <span className="phase-tag">phase 1 · table.schema.json</span></h2>
        {table ? <BudgetTable tpl={table} /> : <div className="loading"><span className="spinner" /> กำลังโหลดตาราง...</div>}
      </div>

      <div className="card">
        <h2>
          กราฟเปรียบเทียบงบ <span className="phase-tag">phase 2 · sub agent · bar_chart.schema.json</span>
        </h2>
        {chart ? (
          <BarChart tpl={chart} />
        ) : (
          <div className="loading">
            <span className="spinner" />
            {chartPending ? "sub agent กำลังแปลงข้อมูลเป็นกราฟ..." : "รอตารางก่อน..."}
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
<script>
  // Manual transform (classic runtime — plain UMD scripts, no bundler for
  // the react/jsx-runtime import the automatic runtime would emit).
  const src = document.getElementById("app-src").textContent;
  const { code } = Babel.transform(src, { presets: [["react", { runtime: "classic" }]] });
  (0, eval)(code);
</script>
</body>
</html>
