<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<title>Graph model — bar + pie only</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
<style>
  :root {
    color-scheme: light;
    --surface-1: #fcfcfb; --page: #f9f9f7;
    --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #898781;
    --gridline: #e1e0d9; --baseline: #c3c2b7; --border: rgba(11,11,11,0.10);
    --series-1: #2a78d6; /* blue   — งบประมาณต้นปี */
    --series-2: #eb6834; /* orange — งบที่ใช้ไป */
    --series-3: #1baf7a; /* aqua   — category slot */
    --series-4: #eda100; /* yellow — category slot */
    --brand: #4a3aa7;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --surface-1: #1a1a19; --page: #0d0d0d;
      --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #898781;
      --gridline: #2c2c2a; --baseline: #383835; --border: rgba(255,255,255,0.10);
      --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
      --brand: #9085e9;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-1: #1a1a19; --page: #0d0d0d;
    --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #898781;
    --gridline: #2c2c2a; --baseline: #383835; --border: rgba(255,255,255,0.10);
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
    --brand: #9085e9;
  }

  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--page); color: var(--text-primary); }
  #root { max-width: 1000px; margin: 0 auto; padding: 32px 20px 64px; }

  h1 { font-size: 18px; margin: 0 0 4px; }
  .subtitle { font-size: 13px; color: var(--text-secondary); margin: 0 0 18px; }

  .flow {
    display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--text-secondary);
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; margin-bottom: 22px;
  }
  .flow-step { display: flex; align-items: center; gap: 6px; }
  .flow-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--gridline); flex: none; }
  .flow-dot.done { background: var(--brand); }
  .flow-dot.active { background: var(--series-2); animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.35; } }
  .flow-arrow { color: var(--text-muted); }
  .flow code { font-size: 11px; }

  .grid-2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; }
  .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 20px; }
  .card h2 { font-size: 13.5px; margin: 0 0 3px; }
  .card .card-sub { font-size: 11.5px; color: var(--text-muted); margin: 0 0 14px; }
  .phase-tag { font-size: 9.5px; font-weight: 600; letter-spacing: 0.02em; text-transform: uppercase; padding: 2px 7px; border-radius: 99px; color: var(--text-secondary); border: 1px solid var(--border); margin-left: 8px; }

  .legend { display: flex; gap: 14px; margin-bottom: 10px; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-secondary); }
  .swatch { width: 9px; height: 9px; border-radius: 2px; flex: none; }
  .swatch.round { border-radius: 50%; }

  .axis-label { fill: var(--text-muted); font-size: 10px; }
  .gridline-el { stroke: var(--gridline); stroke-width: 1; }
  .baseline-el { stroke: var(--baseline); stroke-width: 1; }

  .donut-wrap { display: flex; flex-direction: column; align-items: center; }
  .donut-center { font-size: 20px; font-weight: 700; }
  .donut-center-label { font-size: 10.5px; color: var(--text-muted); }

  .tooltip {
    position: absolute; pointer-events: none; background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.18);
    max-width: 240px; line-height: 1.5; z-index: 10;
  }
  .tooltip .t-title { font-weight: 600; margin-bottom: 2px; }
  .tooltip .t-row { display: flex; justify-content: space-between; gap: 12px; color: var(--text-secondary); }

  .loading { font-size: 12.5px; color: var(--text-muted); display: flex; align-items: center; gap: 8px; padding: 60px 0; justify-content: center; }
  .spinner { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--gridline); border-top-color: var(--brand); animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/plain" id="app-src">
const { useState, useEffect, useRef } = React;

const TABLE_URL = "../../../templates/examples/ict_budget_2569.table.json";
const CHART_TOP_N = 10;

const CATEGORY_MAP = [
  { prefix: "694101", label: "ภารกิจทั่วไปคณะ", color: "var(--series-1)" },
  { prefix: "694103", label: "ทำนุบำรุงศิลปวัฒนธรรม", color: "var(--series-2)" },
  { prefix: "694104", label: "วิจัยและพัฒนาศักยภาพ", color: "var(--series-3)" },
  { prefix: "694105", label: "บริการวิชาการ/ชุมชน", color: "var(--series-4)" },
];

function fmtCurrency(n) { return new Intl.NumberFormat("th-TH", { maximumFractionDigits: 0 }).format(n); }
function fmtCompact(n) {
  if (Math.abs(n) >= 1_000_000) return (n / 1_000_000).toFixed(1).replace(/\.0$/, "") + "M";
  if (Math.abs(n) >= 1_000) return Math.round(n / 1_000) + "k";
  return String(n);
}

// The data flow this file exists to show:
//   1. fetch(table.schema.json)   -- rows straight from data_layer/mcp_server, fast
//   2. sub agent (simulated here with setTimeout) reshapes the SAME rows into
//      bar_chart.schema.json and pie_chart.schema.json -- never invents its own format
//   3. this component only renders whatever template shape is in state -- no
//      table, no KPI cards, graphs only
function useGraphData() {
  const [stage, setStage] = useState("fetching"); // fetching -> deriving -> ready
  const [chart, setChart] = useState(null);
  const [categories, setCategories] = useState(null);

  useEffect(() => {
    fetch(TABLE_URL).then(r => r.json()).then(tpl => {
      setStage("deriving");
      setTimeout(() => {
        const ranked = [...tpl.rows]
          .map(r => ({ ...r, total: r.planned + r.actual }))
          .sort((a, b) => b.total - a.total)
          .slice(0, CHART_TOP_N);
        setChart({
          type: "bar",
          title: `งบต้นปี vs ใช้จริง — ${CHART_TOP_N} โครงการงบสูงสุด`,
          labels: ranked.map(r => r.code),
          datasets: [
            { label: "งบประมาณต้นปี", data: ranked.map(r => r.planned), backgroundColor: "var(--series-1)" },
            { label: "งบที่ใช้ไป", data: ranked.map(r => r.actual), backgroundColor: "var(--series-2)" },
          ],
          meta: { names: ranked.map(r => r.name) },
        });

        const cats = CATEGORY_MAP.map(c => ({
          ...c,
          value: tpl.rows.filter(r => r.code.startsWith(c.prefix)).reduce((s, r) => s + r.actual, 0),
        }));
        setCategories({
          type: "pie",
          title: "งบที่ใช้ไปตามภารกิจ",
          labels: cats.map(c => c.label),
          datasets: [{ label: "งบที่ใช้ไป", data: cats.map(c => c.value), backgroundColor: cats.map(c => c.color) }],
        });
        setStage("ready");
      }, 600);
    });
  }, []);

  return { stage, chart, categories };
}

function FlowStrip({ stage }) {
  const step = s => (stage === s ? "active" : (["fetching", "deriving", "ready"].indexOf(stage) > ["fetching", "deriving", "ready"].indexOf(s) ? "done" : ""));
  return (
    <div className="flow">
      <div className="flow-step"><span className={"flow-dot " + step("fetching")} /><code>table.schema.json</code> fetch</div>
      <span className="flow-arrow">→</span>
      <div className="flow-step"><span className={"flow-dot " + step("deriving")} />sub agent derives <code>bar_chart</code> + <code>pie_chart</code></div>
      <span className="flow-arrow">→</span>
      <div className="flow-step"><span className={"flow-dot " + step("ready")} />render</div>
    </div>
  );
}

function BarChart({ tpl }) {
  const [hover, setHover] = useState(null);
  const wrapRef = useRef(null);
  const width = 600, height = 320;
  const marginLeft = 50, marginRight = 8, marginTop = 8, marginBottom = 36;
  const plotW = width - marginLeft - marginRight, plotH = height - marginTop - marginBottom;
  const maxVal = Math.max(1, ...tpl.datasets.flatMap(d => d.data));
  const niceMax = Math.ceil(maxVal / 300000) * 300000;
  const gridSteps = 4;
  const n = tpl.labels.length, groupW = plotW / n, seriesCount = tpl.datasets.length;
  const groupGap = 8, barGap = 2;
  const barW = (groupW - groupGap - barGap * (seriesCount - 1)) / seriesCount;
  const yFor = v => plotH - (v / niceMax) * plotH;

  return (
    <div style={{ position: "relative" }} ref={wrapRef}>
      <div className="legend">
        {tpl.datasets.map(d => (<div className="legend-item" key={d.label}><span className="swatch" style={{ background: d.backgroundColor }} />{d.label}</div>))}
      </div>
      <svg viewBox={`0 0 ${width} ${height}`} width="100%" role="img" aria-label={tpl.title}>
        <g transform={`translate(${marginLeft},${marginTop})`}>
          {Array.from({ length: gridSteps + 1 }).map((_, i) => {
            const v = (niceMax / gridSteps) * i, y = yFor(v);
            return (<g key={i}><line x1={0} x2={plotW} y1={y} y2={y} className="gridline-el" /><text x={-8} y={y} textAnchor="end" dominantBaseline="middle" className="axis-label">{fmtCompact(v)}</text></g>);
          })}
          <line x1={0} x2={plotW} y1={plotH} y2={plotH} className="baseline-el" />
          {tpl.labels.map((label, gi) => {
            const gx = gi * groupW;
            return (
              <g key={label}>
                {tpl.datasets.map((d, si) => {
                  const v = d.data[gi], y = yFor(v), h = plotH - y, x = gx + si * (barW + barGap);
                  const isHover = hover && hover.gi === gi && hover.si === si;
                  return (
                    <rect key={d.label} x={x} y={y} width={barW} height={Math.max(h, 0)} rx={3}
                      fill={d.backgroundColor} opacity={isHover ? 1 : 0.92}
                      onMouseEnter={(e) => { const box = wrapRef.current.getBoundingClientRect(); setHover({ gi, si, x: e.clientX - box.left + 12, y: e.clientY - box.top + 12 }); }}
                      onMouseMove={(e) => { const box = wrapRef.current.getBoundingClientRect(); setHover(h2 => h2 && { ...h2, x: e.clientX - box.left + 12, y: e.clientY - box.top + 12 }); }}
                      onMouseLeave={() => setHover(null)} />
                  );
                })}
                <text x={gx + groupW / 2 - groupGap / 2} y={plotH + 16} textAnchor="middle" className="axis-label">{label.slice(-4)}</text>
              </g>
            );
          })}
        </g>
      </svg>
      {hover && (
        <div className="tooltip" style={{ left: hover.x, top: hover.y }}>
          <div className="t-title">{tpl.labels[hover.gi]} — {tpl.meta.names[hover.gi]}</div>
          {tpl.datasets.map(d => (<div className="t-row" key={d.label}><span>{d.label}</span><span>฿{fmtCurrency(d.data[hover.gi])}</span></div>))}
        </div>
      )}
    </div>
  );
}

function Donut({ tpl }) {
  const [hover, setHover] = useState(null);
  const data = tpl.datasets[0].data, colors = tpl.datasets[0].backgroundColor;
  const total = data.reduce((s, v) => s + v, 0);
  const r = 62, cx = 90, cy = 90, strokeW = 22, circ = 2 * Math.PI * r, gapPx = 3;

  let cumulative = 0;
  const segments = data.map((v, i) => {
    const frac = total > 0 ? v / total : 0;
    const len = Math.max(frac * circ - gapPx, 0);
    const seg = { len, dashoffset: -cumulative * circ, color: colors[i], i };
    cumulative += frac;
    return seg;
  });

  return (
    <div className="donut-wrap">
      <svg viewBox="0 0 180 180" width="180" height="180">
        <g transform={`rotate(-90 ${cx} ${cy})`}>
          <circle cx={cx} cy={cy} r={r} fill="none" stroke="var(--gridline)" strokeWidth={strokeW} />
          {segments.map(s => (
            <circle key={s.i} cx={cx} cy={cy} r={r} fill="none" stroke={s.color} strokeWidth={strokeW}
              strokeDasharray={`${s.len} ${circ - s.len}`} strokeDashoffset={s.dashoffset}
              opacity={hover === null || hover === s.i ? 1 : 0.4}
              onMouseEnter={() => setHover(s.i)} onMouseLeave={() => setHover(null)} style={{ cursor: "pointer" }} />
          ))}
        </g>
        <text x={cx} y={cy - 4} textAnchor="middle" className="donut-center" fill="var(--text-primary)">฿{fmtCompact(total)}</text>
        <text x={cx} y={cy + 14} textAnchor="middle" className="donut-center-label" fill="var(--text-muted)">รวมใช้ไป</text>
      </svg>
      <div className="legend" style={{ justifyContent: "center" }}>
        {tpl.labels.map((l, i) => (
          <div className="legend-item" key={l}><span className="swatch round" style={{ background: colors[i] }} />{l} ({total > 0 ? (data[i] / total * 100).toFixed(0) : 0}%)</div>
        ))}
      </div>
    </div>
  );
}

function App() {
  const { stage, chart, categories } = useGraphData();
  return (
    <div>
      <h1>งบประมาณคณะ ICT ปีงบประมาณ 2569 — กราฟล้วน</h1>
      <p className="subtitle">Graph model: ไม่มีตาราง ไม่มี KPI card เน้นดู data flow table → sub agent → bar_chart/pie_chart</p>

      <FlowStrip stage={stage} />

      <div className="grid-2">
        <div className="card">
          <h2>งบต้นปี vs ใช้จริง <span className="phase-tag">bar_chart.schema.json</span></h2>
          <p className="card-sub">{CHART_TOP_N} โครงการงบสูงสุด</p>
          {chart ? <BarChart tpl={chart} /> : <div className="loading"><span className="spinner" /> {stage === "fetching" ? "กำลังโหลดข้อมูล..." : "sub agent กำลังสร้างกราฟ..."}</div>}
        </div>
        <div className="card">
          <h2>งบตามภารกิจ <span className="phase-tag">pie_chart.schema.json</span></h2>
          <p className="card-sub">สัดส่วนงบที่ใช้ไปจริง</p>
          {categories ? <Donut tpl={categories} /> : <div className="loading"><span className="spinner" /> {stage === "fetching" ? "กำลังโหลดข้อมูล..." : "sub agent กำลังสร้างกราฟ..."}</div>}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
<script>
  const src = document.getElementById("app-src").textContent;
  const { code } = Babel.transform(src, { presets: [["react", { runtime: "classic" }]] });
  (0, eval)(code);
</script>
</body>
</html>
