<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<title>Budget insights</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
<style>
  :root {
    color-scheme: light;
    --surface-1: #fcfcfb; --page: #f9f9f7;
    --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #706d66;
    --gridline: #e1e0d9; --baseline: #c3c2b7; --border: rgba(11,11,11,0.10);
    --chart-1: #2a78d6; --chart-2: #eb6834; --chart-3: #1baf7a; --chart-4: #eda100;
    --brand: #4a3aa7;
    --good: #0ca30c; --good-soft: rgba(12,163,12,0.12);
    --warning: #c98500; --warning-soft: rgba(201,133,0,0.14);
    --critical: #d03b3b; --critical-soft: rgba(208,59,59,0.12);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --surface-1: #1a1a19; --page: #0d0d0d;
      --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #b0ada6;
      --gridline: #2c2c2a; --baseline: #383835; --border: rgba(255,255,255,0.10);
      --chart-1: #3987e5; --chart-2: #d95926; --chart-3: #199e70; --chart-4: #c98500;
      --brand: #9085e9;
      --good: #0ca30c; --good-soft: rgba(12,163,12,0.18);
      --warning: #fab219; --warning-soft: rgba(250,178,25,0.16);
      --critical: #e66767; --critical-soft: rgba(230,103,103,0.16);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-1: #1a1a19; --page: #0d0d0d;
    --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #b0ada6;
    --gridline: #2c2c2a; --baseline: #383835; --border: rgba(255,255,255,0.10);
    --chart-1: #3987e5; --chart-2: #d95926; --chart-3: #199e70; --chart-4: #c98500;
    --brand: #9085e9;
    --good: #0ca30c; --good-soft: rgba(12,163,12,0.18);
    --warning: #fab219; --warning-soft: rgba(250,178,25,0.16);
    --critical: #e66767; --critical-soft: rgba(230,103,103,0.16);
  }

  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--page); color: var(--text-primary); line-height: 1.6; }
  #root { max-width: 1080px; margin: 0 auto; padding: 32px 20px 64px; }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 3px; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }

  h1 { font-size: 18px; margin: 0 0 4px; }
  .subtitle { font-size: 13px; color: var(--text-secondary); margin: 0 0 22px; }

  .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 16px; }
  .card h2 { font-size: 13.5px; margin: 0 0 3px; display: flex; align-items: center; gap: 8px; }
  .card .card-sub { font-size: 11.5px; color: var(--text-muted); margin: 0 0 14px; }
  .schema-tag { font-size: 9.5px; font-weight: 600; letter-spacing: 0.02em; text-transform: uppercase; padding: 2px 7px; border-radius: 99px; color: var(--text-secondary); border: 1px solid var(--border); }

  /* ---- gauge ---- */
  .gauge-wrap { display: flex; flex-direction: column; align-items: center; }
  .gauge-value { font-size: 28px; font-weight: 700; margin-top: -34px; }
  .gauge-caption { font-size: 11.5px; color: var(--text-muted); }
  .gauge-legend { display: flex; gap: 14px; margin-top: 10px; flex-wrap: wrap; justify-content: center; }
  .gauge-legend-item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-secondary); }
  .gauge-swatch { width: 9px; height: 9px; border-radius: 2px; flex: none; }

  /* ---- stat cards ---- */
  .stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
  .stat-card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 15px; }
  .stat-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
  .stat-icon { width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 13px; flex: none; }
  .stat-label { font-size: 11px; color: var(--text-muted); }
  .stat-value { font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat-trend { font-size: 10.5px; margin-top: 6px; }
  .stat-trend.good { color: var(--good); }
  .stat-trend.warning { color: var(--warning); }
  .stat-trend.critical { color: var(--critical); }
  .stat-trend.neutral { color: var(--text-muted); }
  @media (max-width: 640px) { .stat-row { grid-template-columns: repeat(2, 1fr); } }

  /* ---- charts ---- */
  .legend { display: flex; gap: 14px; margin-bottom: 10px; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-secondary); }
  .swatch { width: 9px; height: 9px; border-radius: 2px; flex: none; }
  .axis-label { fill: var(--text-muted); font-size: 10px; }
  .gridline-el { stroke: var(--gridline); stroke-width: 1; }
  .baseline-el { stroke: var(--baseline); stroke-width: 1; }
  .tooltip {
    position: absolute; pointer-events: none; background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.18);
    max-width: 240px; line-height: 1.5; z-index: 10;
  }
  .tooltip .t-title { font-weight: 600; margin-bottom: 2px; }
  .tooltip .t-row { display: flex; justify-content: space-between; gap: 12px; color: var(--text-secondary); }

  .loading { font-size: 12.5px; color: var(--text-muted); display: flex; align-items: center; gap: 8px; padding: 40px 0; justify-content: center; }
  .spinner { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--gridline); border-top-color: var(--brand); animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/plain" id="app-src">
const { useState, useEffect, useRef } = React;

const TABLE_URL = "../../../templates/examples/ict_budget_2569.table.json";

const CATEGORY_MAP = [
  { prefix: "694101", label: "ภารกิจทั่วไป", color: "var(--chart-1)" },
  { prefix: "694103", label: "ศิลปวัฒนธรรม", color: "var(--chart-2)" },
  { prefix: "694104", label: "วิจัย", color: "var(--chart-3)" },
  { prefix: "694105", label: "บริการวิชาการ", color: "var(--chart-4)" },
];

function fmtCurrency(n) { return new Intl.NumberFormat("th-TH", { maximumFractionDigits: 0 }).format(Math.round(n)); }
function fmtCompact(n) {
  if (Math.abs(n) >= 1_000_000) return (n / 1_000_000).toFixed(1).replace(/\.0$/, "") + "M";
  if (Math.abs(n) >= 1_000) return Math.round(n / 1_000) + "k";
  return String(Math.round(n));
}

// Every section below fills one templates/*.schema.json shape with real
// numbers from ict_budget_2569.table.json -- computed once here the way a
// sub agent would, then handed to a renderer that only trusts the shape.
function useInsights() {
  const [table, setTable] = useState(null);
  const [gauge, setGauge] = useState(null);
  const [stats, setStats] = useState(null);
  const [stacked, setStacked] = useState(null);
  const [area, setArea] = useState(null);

  useEffect(() => {
    fetch(TABLE_URL).then(r => r.json()).then(tpl => {
      setTable(tpl);
      const totalPlanned = tpl.rows.reduce((s, r) => s + r.planned, 0);
      const totalActual = tpl.rows.reduce((s, r) => s + r.actual, 0);
      const overBudget = tpl.rows.filter(r => r.planned > 0 && r.actual > r.planned).length;
      const util = totalPlanned > 0 ? (totalActual / totalPlanned) * 100 : 0;

      // gauge_chart.schema.json
      setGauge({
        type: "gauge", title: "อัตราการเบิกจ่ายงบประมาณ",
        value: util, min: 0, max: 120, unit: "%",
        zones: [
          { from: 0, to: 80, color: "good" },
          { from: 80, to: 100, color: "warning" },
          { from: 100, to: 120, color: "critical" },
        ],
      });

      // 4x stat_card.schema.json
      setStats([
        { type: "stat_card", label: "งบประมาณต้นปีรวม", value: totalPlanned, format: "currency", icon: "💰", status: "neutral", trend: { direction: "flat", label: "ปีงบประมาณ 2569" } },
        { type: "stat_card", label: "งบที่ใช้ไปรวม", value: totalActual, format: "currency", icon: "📊", status: util > 100 ? "critical" : "good", trend: { direction: util > 100 ? "up" : "flat", label: `${util.toFixed(1)}% ของแผน` } },
        { type: "stat_card", label: "โครงการเกินแผน", value: overBudget, format: "number", icon: "⚠️", status: overBudget > 0 ? "warning" : "good", trend: { direction: overBudget > 0 ? "up" : "flat", label: overBudget > 0 ? "ต้องติดตาม" : "ปกติทั้งหมด" } },
        { type: "stat_card", label: "โครงการทั้งหมด", value: tpl.rows.length, format: "number", icon: "📁", status: "neutral", trend: { direction: "flat", label: `${CATEGORY_MAP.length} หมวดภารกิจ` } },
      ]);

      // stacked_bar_chart.schema.json
      const catAgg = CATEGORY_MAP.map(c => {
        const catRows = tpl.rows.filter(r => r.code.startsWith(c.prefix));
        const planned = catRows.reduce((s, r) => s + r.planned, 0);
        const actual = catRows.reduce((s, r) => s + r.actual, 0);
        return { label: c.label, used: actual, remaining: Math.max(planned - actual, 0) };
      });
      setStacked({
        type: "stacked_bar", title: "ใช้ไป vs คงเหลือ ตามภารกิจ",
        labels: catAgg.map(c => c.label),
        datasets: [
          { label: "ใช้ไปแล้ว", stack: "budget", data: catAgg.map(c => c.used), backgroundColor: "var(--chart-1)" },
          { label: "คงเหลือ", stack: "budget", data: catAgg.map(c => c.remaining), backgroundColor: "var(--gridline)" },
        ],
      });

      // area_chart.schema.json
      const sorted = [...tpl.rows].sort((a, b) => a.code.localeCompare(b.code));
      let running = 0;
      const points = sorted.map(r => { running += r.actual; return { code: r.code, name: r.name, cumulative: running }; });
      setArea({
        type: "area", title: "งบที่ใช้ไปสะสม เรียงตามรหัสโครงการ",
        points,
      });
    });
  }, []);

  return { table, gauge, stats, stacked, area };
}

function polarPoint(cx, cy, r, angleDeg) {
  const rad = (angleDeg * Math.PI) / 180;
  return { x: cx + r * Math.cos(rad), y: cy - r * Math.sin(rad) };
}
function valueToAngle(value, min, max) {
  const f = Math.min(Math.max((value - min) / (max - min), 0), 1);
  return 180 - f * 180;
}

function Gauge({ tpl }) {
  const cx = 110, cy = 100, r = 80, strokeW = 16;
  const zoneColor = { good: "var(--good)", warning: "var(--warning)", critical: "var(--critical)" };
  const activeZone = tpl.zones.find(z => tpl.value >= z.from && tpl.value <= z.to) || tpl.zones[tpl.zones.length - 1];
  const needleAngle = valueToAngle(tpl.value, tpl.min, tpl.max);
  const needleTip = polarPoint(cx, cy, r, needleAngle);

  return (
    <div className="gauge-wrap">
      <svg viewBox="0 0 220 120" width="260">
        {tpl.zones.map((z, i) => {
          const a1 = valueToAngle(z.from, tpl.min, tpl.max);
          const a2 = valueToAngle(z.to, tpl.min, tpl.max);
          const p1 = polarPoint(cx, cy, r, a1);
          const p2 = polarPoint(cx, cy, r, a2);
          const largeArc = Math.abs(a1 - a2) > 180 ? 1 : 0;
          return <path key={i} d={`M ${p1.x} ${p1.y} A ${r} ${r} 0 ${largeArc} 1 ${p2.x} ${p2.y}`} fill="none" stroke={zoneColor[z.color]} strokeWidth={strokeW} strokeLinecap="butt" opacity={0.28} />;
        })}
        <path d={`M ${polarPoint(cx, cy, r, 180).x} ${polarPoint(cx, cy, r, 180).y} A ${r} ${r} 0 ${valueToAngle(tpl.min, tpl.min, tpl.max) - needleAngle > 180 ? 1 : 0} 1 ${needleTip.x} ${needleTip.y}`}
          fill="none" stroke={zoneColor[activeZone.color]} strokeWidth={strokeW} strokeLinecap="round" />
        <circle cx={needleTip.x} cy={needleTip.y} r={5} fill={zoneColor[activeZone.color]} stroke="var(--surface-1)" strokeWidth={2} />
      </svg>
      <div className="gauge-value">{tpl.value.toFixed(1)}{tpl.unit}</div>
      <div className="gauge-caption">จาก {tpl.min}–{tpl.max}{tpl.unit}</div>
      <div className="gauge-legend">
        {tpl.zones.map((z, i) => (
          <div className="gauge-legend-item" key={i}><span className="gauge-swatch" style={{ background: zoneColor[z.color] }} />{z.from}–{z.to}{tpl.unit}</div>
        ))}
      </div>
    </div>
  );
}

function StatRow({ cards }) {
  const iconBg = { good: "var(--good-soft)", warning: "var(--warning-soft)", critical: "var(--critical-soft)", neutral: "var(--gridline)" };
  const iconColor = { good: "var(--good)", warning: "var(--warning)", critical: "var(--critical)", neutral: "var(--text-secondary)" };
  return (
    <div className="stat-row">
      {cards.map(c => (
        <div className="stat-card" key={c.label}>
          <div className="stat-top">
            <div>
              <div className="stat-label">{c.label}</div>
              <div className="stat-value">{c.format === "currency" ? "฿" + fmtCurrency(c.value) : c.value}</div>
            </div>
            <div className="stat-icon" style={{ background: iconBg[c.status], color: iconColor[c.status] }}>{c.icon}</div>
          </div>
          <div className={"stat-trend " + c.status}>{c.trend.label}</div>
        </div>
      ))}
    </div>
  );
}

function StackedBar({ tpl }) {
  const [hover, setHover] = useState(null);
  const wrapRef = useRef(null);
  const width = 560, height = 240;
  const marginLeft = 50, marginRight = 8, marginTop = 8, marginBottom = 30;
  const plotW = width - marginLeft - marginRight, plotH = height - marginTop - marginBottom;
  const totals = tpl.labels.map((_, gi) => tpl.datasets.reduce((s, d) => s + d.data[gi], 0));
  const maxVal = Math.max(1, ...totals);
  const niceMax = Math.ceil(maxVal / 500000) * 500000;
  const gridSteps = 4;
  const n = tpl.labels.length, groupW = plotW / n, barW = groupW * 0.5;
  const yFor = v => plotH - (v / niceMax) * plotH;

  return (
    <div style={{ position: "relative" }} ref={wrapRef}>
      <div className="legend">
        {tpl.datasets.map(d => (<div className="legend-item" key={d.label}><span className="swatch" style={{ background: d.backgroundColor }} />{d.label}</div>))}
      </div>
      <svg viewBox={`0 0 ${width} ${height}`} width="100%">
        <g transform={`translate(${marginLeft},${marginTop})`}>
          {Array.from({ length: gridSteps + 1 }).map((_, i) => {
            const v = (niceMax / gridSteps) * i, y = yFor(v);
            return (<g key={i}><line x1={0} x2={plotW} y1={y} y2={y} className="gridline-el" /><text x={-8} y={y} textAnchor="end" dominantBaseline="middle" className="axis-label">{fmtCompact(v)}</text></g>);
          })}
          <line x1={0} x2={plotW} y1={plotH} y2={plotH} className="baseline-el" />
          {tpl.labels.map((label, gi) => {
            const gx = gi * groupW + (groupW - barW) / 2;
            let stackTop = 0;
            const isHover = hover === gi;
            return (
              <g key={label}>
                {tpl.datasets.map(d => {
                  const v = d.data[gi];
                  const yTop = yFor(stackTop + v), yBottom = yFor(stackTop);
                  stackTop += v;
                  return <rect key={d.label} x={gx} y={yTop} width={barW} height={Math.max(yBottom - yTop, 0)} fill={d.backgroundColor} opacity={isHover ? 1 : 0.92}
                    onMouseEnter={() => setHover(gi)} onMouseLeave={() => setHover(null)} />;
                })}
                <text x={gx + barW / 2} y={plotH + 16} textAnchor="middle" className="axis-label">{label}</text>
              </g>
            );
          })}
        </g>
      </svg>
    </div>
  );
}

function AreaChart({ points }) {
  const [hover, setHover] = useState(null);
  const wrapRef = useRef(null);
  const width = 620, height = 240;
  const marginLeft = 54, marginRight = 10, marginTop = 10, marginBottom = 26;
  const plotW = width - marginLeft - marginRight, plotH = height - marginTop - marginBottom;
  const maxVal = Math.max(1, ...points.map(p => p.cumulative));
  const niceMax = Math.ceil(maxVal / 500000) * 500000;
  const gridSteps = 4;
  const n = points.length;
  const xFor = i => (n <= 1 ? 0 : (i / (n - 1)) * plotW);
  const yFor = v => plotH - (v / niceMax) * plotH;
  const linePath = points.map((p, i) => `${i === 0 ? "M" : "L"}${xFor(i)},${yFor(p.cumulative)}`).join(" ");
  const areaPath = linePath + ` L${xFor(n - 1)},${plotH} L0,${plotH} Z`;

  return (
    <div style={{ position: "relative" }} ref={wrapRef}>
      <svg viewBox={`0 0 ${width} ${height}`} width="100%">
        <g transform={`translate(${marginLeft},${marginTop})`}>
          {Array.from({ length: gridSteps + 1 }).map((_, i) => {
            const v = (niceMax / gridSteps) * i, y = yFor(v);
            return (<g key={i}><line x1={0} x2={plotW} y1={y} y2={y} className="gridline-el" /><text x={-8} y={y} textAnchor="end" dominantBaseline="middle" className="axis-label">{fmtCompact(v)}</text></g>);
          })}
          <line x1={0} x2={plotW} y1={plotH} y2={plotH} className="baseline-el" />
          <path d={areaPath} fill="var(--chart-1)" opacity={0.14} />
          <path d={linePath} fill="none" stroke="var(--chart-1)" strokeWidth={2} />
          {points.map((p, i) => (
            <circle key={p.code} cx={xFor(i)} cy={yFor(p.cumulative)} r={hover === i ? 4 : 2.2} fill="var(--chart-1)"
              onMouseEnter={() => setHover(i)} onMouseLeave={() => setHover(null)} style={{ cursor: "pointer" }} />
          ))}
          {points.map((p, i) => (
            i % Math.ceil(n / 8) === 0 && <text key={p.code} x={xFor(i)} y={plotH + 14} textAnchor="middle" className="axis-label">{p.code.slice(-4)}</text>
          ))}
        </g>
      </svg>
      {hover !== null && (
        <div className="tooltip" style={{ left: marginLeft + xFor(hover) - 60, top: 6 }}>
          <div className="t-title">{points[hover].code} — {points[hover].name}</div>
          <div className="t-row"><span>สะสม</span><span>฿{fmtCurrency(points[hover].cumulative)}</span></div>
        </div>
      )}
    </div>
  );
}

function App() {
  const { table, gauge, stats, stacked, area } = useInsights();

  return (
    <div>
      <h1>งบประมาณคณะ ICT ปีงบประมาณ 2569 — Insights</h1>
      <p className="subtitle">โชว์ schema ใหม่ 4 แบบด้วยข้อมูลจริง: gauge_chart, stat_card, stacked_bar_chart, area_chart</p>

      {!table ? (
        <div className="loading"><span className="spinner" /> กำลังโหลดข้อมูล...</div>
      ) : (
        <React.Fragment>
          <div className="card" style={{ display: "flex", justifyContent: "center" }}>
            <div>
              <h2 style={{ justifyContent: "center" }}>{gauge.title} <span className="schema-tag">gauge_chart.schema.json</span></h2>
              <Gauge tpl={gauge} />
            </div>
          </div>

          <StatRow cards={stats} />

          <div className="card">
            <h2>{stacked.title} <span className="schema-tag">stacked_bar_chart.schema.json</span></h2>
            <p className="card-sub">คงเหลือ = max(งบต้นปี − ใช้จริง, 0) ต่อภารกิจ</p>
            <StackedBar tpl={stacked} />
          </div>

          <div className="card">
            <h2>{area.title} <span className="schema-tag">area_chart.schema.json</span></h2>
            <p className="card-sub">ยอดสะสมของงบที่ใช้ไปจริง {table.rows.length} โครงการ</p>
            <AreaChart points={area.points} />
          </div>
        </React.Fragment>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
<script>
  const src = document.getElementById("app-src").textContent;
  const { code } = Babel.transform(src, { presets: [["react", { runtime: "classic" }]] });
  (0, eval)(code);
</script>
</body>
</html>
