<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<title>Dashboard Template</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
<style>
  :root {
    --bg: #0a0a0c; --surface: #131316; --surface-2: #1a1a1e;
    --gridline: #232327; --baseline: #303036;
    --border: rgba(255,255,255,0.08); --border-strong: rgba(255,255,255,0.14);
    --text-primary: #f4f4f5; --text-secondary: #a1a1aa; --text-muted: #82828c;
    --accent: #7c6ee0; --accent-soft: rgba(124,110,224,0.16);
    --good: #22c55e; --good-soft: rgba(34,197,94,0.14);
    --warning: #f5a524; --warning-soft: rgba(245,165,36,0.14);
    --critical: #ef4444; --critical-soft: rgba(239,68,68,0.14);
    /* fallback categorical steps, used only when a widget omits its own color */
    --chart-1: #3987e5; --chart-2: #d95926; --chart-3: #199e70; --chart-4: #c98500;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background:
      radial-gradient(900px 480px at 12% -8%, rgba(124,110,224,0.10), transparent 60%),
      radial-gradient(700px 420px at 100% 0%, rgba(57,135,229,0.08), transparent 55%),
      var(--bg);
    color: var(--text-primary); font-size: 13px; line-height: 1.6;
  }
  #root { max-width: 1240px; margin: 0 auto; padding: 28px 24px 64px; }
  ::selection { background: var(--accent-soft); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  }

  /* ---- header ---- */
  .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
  .head-title { display: flex; align-items: center; gap: 9px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
  .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 3px var(--good-soft); animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
  .head-sub { font-size: 12.5px; color: var(--text-secondary); margin: 5px 0 0; }
  .head-meta { font-size: 11px; color: var(--text-muted); text-align: right; }
  .head-meta code { font-size: 10px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; }

  /* ---- cards ---- */
  .card {
    background: linear-gradient(180deg, var(--surface), var(--surface) 60%, var(--surface-2));
    border: 1px solid var(--border); border-radius: 14px; padding: 18px 18px 14px;
    animation: rise 0.4s ease both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .card h2 { font-size: 13px; margin: 0 0 2px; font-weight: 650; }
  .card .card-sub { font-size: 11px; color: var(--text-muted); margin: 0 0 14px; }
  .card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .schema-tag { font-size: 9px; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase; padding: 3px 7px; border-radius: 99px; color: var(--text-muted); border: 1px solid var(--border); white-space: nowrap; flex: none; }

  /* ---- widget grid: layout is packed purely from each widget's declared size ---- */
  .widget-row { display: grid; gap: 12px; margin-bottom: 12px; align-items: stretch; }
  .widget-row.row-cols-4 { grid-template-columns: repeat(4, 1fr); }
  .widget-row.row-cols-3 { grid-template-columns: repeat(3, 1fr); }
  .widget-row.row-cols-2 { grid-template-columns: repeat(2, 1fr); }
  .widget-row.row-cols-1 { grid-template-columns: 1fr; }
  @media (max-width: 900px) {
    .widget-row.row-cols-4 { grid-template-columns: repeat(2, 1fr); }
    .widget-row.row-cols-3, .widget-row.row-cols-2 { grid-template-columns: 1fr; }
  }

  /* ---- stat_card ---- */
  .kpi-card { padding: 16px; }
  .kpi-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
  .kpi-icon { width: 32px; height: 32px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 14px; flex: none; }
  .kpi-label { font-size: 11px; color: var(--text-muted); }
  .kpi-value { font-size: 22px; font-weight: 700; margin-top: 2px; letter-spacing: -0.01em; }
  .kpi-trend { font-size: 10.5px; margin-top: 7px; font-weight: 600; }
  .kpi-trend.good { color: var(--good); }
  .kpi-trend.warning { color: var(--warning); }
  .kpi-trend.critical { color: var(--critical); }
  .kpi-trend.neutral { color: var(--text-muted); font-weight: 400; }

  /* ---- shared chart bits ---- */
  .legend { display: flex; gap: 14px; margin-bottom: 10px; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-secondary); }
  .swatch { width: 9px; height: 9px; border-radius: 2px; flex: none; }
  .swatch.round { border-radius: 50%; }
  .axis-label { fill: var(--text-muted); font-size: 9.5px; }
  .gridline-el { stroke: var(--gridline); stroke-width: 1; }
  .baseline-el { stroke: var(--baseline); stroke-width: 1; }
  .crosshair-el { stroke: var(--border-strong); stroke-width: 1; }
  .chart-tooltip {
    position: absolute; pointer-events: none; background: var(--surface-2); border: 1px solid var(--border-strong);
    border-radius: 8px; padding: 8px 10px; font-size: 11px; box-shadow: 0 8px 24px rgba(0,0,0,0.45);
    max-width: 230px; line-height: 1.55; z-index: 10;
  }
  .chart-tooltip .t-title { font-weight: 650; margin-bottom: 3px; color: var(--text-primary); }
  .chart-tooltip .t-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; color: var(--text-secondary); }
  .chart-tooltip .t-row .v { color: var(--text-primary); font-weight: 600; font-variant-numeric: tabular-nums; margin-left: auto; }

  /* ---- gauge ---- */
  .gauge-wrap { display: flex; flex-direction: column; align-items: center; padding-top: 4px; }
  .gauge-value { font-size: 26px; font-weight: 700; margin-top: -36px; letter-spacing: -0.01em; }
  .gauge-caption { font-size: 11px; color: var(--text-muted); }
  .gauge-legend { display: flex; gap: 12px; margin-top: 10px; flex-wrap: wrap; justify-content: center; }
  .gauge-legend-item { display: flex; align-items: center; gap: 6px; font-size: 10.5px; color: var(--text-secondary); }
  .gauge-swatch { width: 8px; height: 8px; border-radius: 2px; flex: none; }

  /* ---- donut ---- */
  .donut-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; padding-top: 4px; }
  .donut-center { font-size: 17px; font-weight: 700; }
  .donut-center-label { font-size: 9.5px; }

  /* ---- table ---- */
  .table-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  thead th { text-align: left; font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-muted); font-weight: 500; padding: 9px 12px; border-bottom: 1px solid var(--border); }
  thead th.num { text-align: right; }
  tbody td { padding: 9px 12px; border-bottom: 1px solid var(--border); font-size: 12px; white-space: nowrap; }
  tbody td.num { text-align: right; font-variant-numeric: tabular-nums; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: rgba(255,255,255,0.02); }

  .loading, .error-box { font-size: 12.5px; color: var(--text-muted); display: flex; align-items: center; gap: 8px; padding: 90px 0; justify-content: center; }
  .error-box { color: var(--critical); }
  .spinner { width: 13px; height: 13px; border-radius: 50%; border: 2px solid var(--gridline); border-top-color: var(--accent); animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/plain" id="app-src">
const { useState, useEffect, useRef } = React;

// Any templates/examples/*.json file matching dashboard_layout.schema.json works here --
// swap it with ?config=path/to/your.json (relative to this file).
const DEFAULT_CONFIG = "../../../templates/examples/dashboard_layout.example.json";
const CONFIG_URL = new URLSearchParams(location.search).get("config") || DEFAULT_CONFIG;

function fmtNumber(n) { return new Intl.NumberFormat("th-TH", { maximumFractionDigits: 0 }).format(Math.round(n)); }
function fmtCompact(n) {
  const abs = Math.abs(n);
  if (abs >= 1_000_000) return (n / 1_000_000).toFixed(1).replace(/\.0$/, "") + "M";
  if (abs >= 1_000) return Math.round(n / 1_000) + "k";
  return String(Math.round(n));
}
function fmtValue(value, format) {
  if (value == null) return "–";
  if (format === "currency") return "฿" + fmtNumber(value);
  if (format === "percent") return Number(value).toFixed(1) + "%";
  if (format === "date") return String(value).slice(0, 10);
  if (format === "text") return String(value);
  return fmtNumber(value);
}

// "nice" axis ceiling, scale-agnostic (works for counts, percents, or millions of baht alike)
function niceMax(value, steps) {
  if (!(value > 0)) return steps;
  const rough = value / steps;
  const mag = Math.pow(10, Math.floor(Math.log10(rough)));
  const norm = rough / mag;
  const niceNorm = norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10;
  return niceNorm * mag * steps;
}

// top-rounded rect (4px, square at the baseline) -- mark spec from the dataviz skill
function topRoundedRectPath(x, y, w, h, r) {
  if (h <= 0 || w <= 0) return "";
  const rr = Math.min(r, w / 2, h);
  return `M${x},${y + h} L${x},${y + rr} Q${x},${y} ${x + rr},${y} L${x + w - rr},${y} Q${x + w},${y} ${x + w},${y + rr} L${x + w},${y + h} Z`;
}
function polarPoint(cx, cy, r, angleDeg) {
  const rad = (angleDeg * Math.PI) / 180;
  return { x: cx + r * Math.cos(rad), y: cy - r * Math.sin(rad) };
}
function valueToAngle(value, min, max) {
  const f = Math.min(Math.max((value - min) / (max - min), 0), 1);
  return 180 - f * 180;
}

// ---- layout packer: greedily fills rows from each widget's declared size,
// flushing a partial row rather than leaving a gap -- see dashboard_layout.schema.json ----
function packRows(widgets) {
  const rows = [];
  let qBuf = [], hBuf = [];
  const flushQ = () => { if (qBuf.length) { rows.push({ cols: qBuf.length, items: qBuf }); qBuf = []; } };
  const flushH = () => { if (hBuf.length) { rows.push({ cols: hBuf.length, items: hBuf }); hBuf = []; } };
  for (const w of widgets) {
    if (w.size === "quarter") {
      flushH();
      qBuf.push(w);
      if (qBuf.length === 4) flushQ();
    } else if (w.size === "half") {
      flushQ();
      hBuf.push(w);
      if (hBuf.length === 2) flushH();
    } else {
      flushQ(); flushH();
      rows.push({ cols: 1, items: [w] });
    }
  }
  flushQ(); flushH();
  return rows;
}

function widgetSubtitle(d) {
  const bits = [];
  if (d.axis && (d.axis.x_label || d.axis.y_label)) bits.push([d.axis.x_label, d.axis.y_label].filter(Boolean).join(" / "));
  if (d.type === "gauge" && d.zones) bits.push(d.zones.map(z => `${z.from}–${z.to}${d.unit || ""}`).join(" · "));
  if (d.type === "table" && d.meta && d.meta.row_count != null) bits.push(`${d.meta.row_count} rows`);
  if (d.meta && d.meta.unit) bits.push(d.meta.unit);
  return bits.length ? bits.join(" — ") : null;
}

function StatCard({ d }) {
  const iconBg = { good: "var(--good-soft)", warning: "var(--warning-soft)", critical: "var(--critical-soft)", neutral: "var(--accent-soft)" };
  const iconColor = { good: "var(--good)", warning: "var(--warning)", critical: "var(--critical)", neutral: "var(--accent)" };
  const status = d.status || "neutral";
  const arrow = d.trend ? ({ up: "▲ ", down: "▼ ", flat: "● " }[d.trend.direction] || "") : "";
  return (
    <div className="card kpi-card">
      <div className="kpi-top">
        <div>
          <div className="kpi-label">{d.label}</div>
          <div className="kpi-value">{fmtValue(d.value, d.format)}</div>
        </div>
        {d.icon && <div className="kpi-icon" style={{ background: iconBg[status], color: iconColor[status] }}>{d.icon}</div>}
      </div>
      {d.trend && <div className={"kpi-trend " + status}>{arrow}{d.trend.label}</div>}
    </div>
  );
}

function Gauge({ d }) {
  const cx = 110, cy = 100, r = 80, strokeW = 16;
  const zoneColor = { good: "var(--good)", warning: "var(--warning)", critical: "var(--critical)" };
  const zones = d.zones && d.zones.length ? d.zones : [{ from: d.min, to: d.max, color: "good" }];
  const activeZone = zones.find(z => d.value >= z.from && d.value <= z.to) || zones[zones.length - 1];
  const needleAngle = valueToAngle(d.value, d.min, d.max);
  const needleTip = polarPoint(cx, cy, r, needleAngle);

  return (
    <div className="gauge-wrap">
      <svg viewBox="0 0 220 120" width="240" role="img" aria-label={`${d.title}: ${d.value.toFixed(1)}${d.unit || ""}`}>
        {zones.map((z, i) => {
          const a1 = valueToAngle(z.from, d.min, d.max), a2 = valueToAngle(z.to, d.min, d.max);
          const p1 = polarPoint(cx, cy, r, a1), p2 = polarPoint(cx, cy, r, a2);
          const largeArc = Math.abs(a1 - a2) > 180 ? 1 : 0;
          return <path key={i} d={`M ${p1.x} ${p1.y} A ${r} ${r} 0 ${largeArc} 1 ${p2.x} ${p2.y}`} fill="none" stroke={zoneColor[z.color]} strokeWidth={strokeW} strokeLinecap="butt" opacity={0.28} />;
        })}
        <path d={`M ${polarPoint(cx, cy, r, 180).x} ${polarPoint(cx, cy, r, 180).y} A ${r} ${r} 0 ${valueToAngle(d.min, d.min, d.max) - needleAngle > 180 ? 1 : 0} 1 ${needleTip.x} ${needleTip.y}`}
          fill="none" stroke={zoneColor[activeZone.color]} strokeWidth={strokeW} strokeLinecap="round" />
        <circle cx={needleTip.x} cy={needleTip.y} r={5} fill={zoneColor[activeZone.color]} stroke="var(--surface)" strokeWidth={2.5} />
      </svg>
      <div className="gauge-value">{d.value.toFixed(1)}{d.unit}</div>
      <div className="gauge-caption">จาก {d.min}–{d.max}{d.unit}</div>
      <div className="gauge-legend">
        {zones.map((z, i) => (
          <div className="gauge-legend-item" key={i}><span className="gauge-swatch" style={{ background: zoneColor[z.color] }} />{z.from}–{z.to}{d.unit}</div>
        ))}
      </div>
    </div>
  );
}

function Donut({ d }) {
  const [hover, setHover] = useState(null);
  const ds = d.datasets[0];
  const cats = d.labels.map((label, i) => ({ label, value: ds.data[i], color: (ds.backgroundColor && ds.backgroundColor[i]) || "var(--accent)" }));
  const total = cats.reduce((s, c) => s + c.value, 0);
  const r = 62, cx = 92, cy = 92, strokeW = 22, circ = 2 * Math.PI * r, gapPx = 2;

  let cumulative = 0;
  const segments = cats.map((c, i) => {
    const frac = total > 0 ? c.value / total : 0;
    const len = Math.max(frac * circ - gapPx, 0);
    const seg = { len, dashoffset: -cumulative * circ, color: c.color, i };
    cumulative += frac;
    return seg;
  });

  return (
    <div className="donut-wrap">
      <svg viewBox="0 0 184 184" width="184" height="184" role="img" aria-label={`${d.title}: total ${fmtCompact(total)}`}>
        <g transform={`rotate(-90 ${cx} ${cy})`}>
          <circle cx={cx} cy={cy} r={r} fill="none" stroke="var(--gridline)" strokeWidth={strokeW} />
          {segments.map(s => (
            <circle key={s.i} cx={cx} cy={cy} r={r} fill="none" stroke={s.color} strokeWidth={strokeW}
              strokeDasharray={`${s.len} ${circ - s.len}`} strokeDashoffset={s.dashoffset}
              opacity={hover === null || hover === s.i ? 1 : 0.32}
              onMouseEnter={() => setHover(s.i)} onMouseLeave={() => setHover(null)} style={{ cursor: "pointer", transition: "opacity 0.15s" }} />
          ))}
        </g>
        <text x={cx} y={cy - 3} textAnchor="middle" className="donut-center" fill="var(--text-primary)">{fmtCompact(hover === null ? total : cats[hover].value)}</text>
        <text x={cx} y={cy + 13} textAnchor="middle" className="donut-center-label axis-label">{hover === null ? ds.label : cats[hover].label}</text>
      </svg>
      <div className="legend" style={{ justifyContent: "center", marginTop: 6 }}>
        {cats.map((c, i) => (
          <div className="legend-item" key={c.label} style={{ cursor: "pointer", opacity: hover === null || hover === i ? 1 : 0.5 }} onMouseEnter={() => setHover(i)} onMouseLeave={() => setHover(null)}>
            <span className="swatch round" style={{ background: c.color }} />{c.label} ({total > 0 ? (c.value / total * 100).toFixed(0) : 0}%)
          </div>
        ))}
      </div>
    </div>
  );
}

function GroupedBar({ d }) {
  const [hover, setHover] = useState(null);
  const wrapRef = useRef(null);
  const width = 900, height = 260;
  const marginLeft = 50, marginRight = 8, marginTop = 8, marginBottom = 32;
  const plotW = width - marginLeft - marginRight, plotH = height - marginTop - marginBottom;
  const n = d.labels.length, seriesN = d.datasets.length;
  const maxVal = Math.max(1, ...d.datasets.flatMap(s => s.data));
  const ceiling = niceMax(maxVal, 4);
  const gridSteps = 4;
  const groupW = plotW / n, barGap = 2;
  const barW = Math.min((groupW - (seriesN - 1) * barGap) / seriesN, 24);
  const seriesOffset = (groupW - (seriesN * barW + (seriesN - 1) * barGap)) / 2;
  const yFor = v => plotH - (v / ceiling) * plotH;

  return (
    <div style={{ position: "relative" }} ref={wrapRef}>
      {seriesN > 1 && (
        <div className="legend">
          {d.datasets.map((s, si) => (<div className="legend-item" key={s.label}><span className="swatch" style={{ background: s.backgroundColor || `var(--chart-${si + 1})` }} />{s.label}</div>))}
        </div>
      )}
      <svg viewBox={`0 0 ${width} ${height}`} width="100%">
        <g transform={`translate(${marginLeft},${marginTop})`}>
          {Array.from({ length: gridSteps + 1 }).map((_, i) => {
            const v = (ceiling / gridSteps) * i, y = yFor(v);
            return (<g key={i}><line x1={0} x2={plotW} y1={y} y2={y} className="gridline-el" /><text x={-8} y={y} textAnchor="end" dominantBaseline="middle" className="axis-label">{fmtCompact(v)}</text></g>);
          })}
          <line x1={0} x2={plotW} y1={plotH} y2={plotH} className="baseline-el" />
          {d.labels.map((label, gi) => {
            const gx = gi * groupW;
            const isHover = hover && hover.gi === gi;
            return (
              <g key={label}>
                {d.datasets.map((s, si) => {
                  const v = s.data[gi] || 0, y = yFor(v), h = plotH - y, x = gx + seriesOffset + si * (barW + barGap);
                  return (
                    <path key={s.label} d={topRoundedRectPath(x, y, barW, Math.max(h, 0), 4)} fill={s.backgroundColor || `var(--chart-${si + 1})`} opacity={isHover ? 1 : 0.9}
                      onMouseEnter={(e) => { const box = wrapRef.current.getBoundingClientRect(); setHover({ gi, x: e.clientX - box.left + 12, y: e.clientY - box.top + 12 }); }}
                      onMouseMove={(e) => { const box = wrapRef.current.getBoundingClientRect(); setHover(h2 => h2 && { ...h2, x: e.clientX - box.left + 12, y: e.clientY - box.top + 12 }); }}
                      onMouseLeave={() => setHover(null)} />
                  );
                })}
                <text x={gx + groupW / 2} y={plotH + 16} textAnchor="middle" className="axis-label">{label}</text>
              </g>
            );
          })}
        </g>
      </svg>
      {hover && (
        <div className="chart-tooltip" style={{ left: hover.x, top: hover.y }}>
          <div className="t-title">{d.labels[hover.gi]}</div>
          {d.datasets.map(s => (<div className="t-row" key={s.label}><span>{s.label}</span><span className="v">{fmtValue(s.data[hover.gi], "number")}</span></div>))}
        </div>
      )}
    </div>
  );
}

function StackedBar({ d }) {
  const [hover, setHover] = useState(null);
  const wrapRef = useRef(null);
  const width = 560, height = 220;
  const marginLeft = 46, marginRight = 8, marginTop = 8, marginBottom = 28;
  const plotW = width - marginLeft - marginRight, plotH = height - marginTop - marginBottom;
  const totals = d.labels.map((_, gi) => d.datasets.reduce((s, ds) => s + (ds.data[gi] || 0), 0));
  const ceiling = niceMax(Math.max(1, ...totals), 4);
  const gridSteps = 4;
  const n = d.labels.length, groupW = plotW / n, barW = Math.min(groupW * 0.5, 44);
  const yFor = v => plotH - (v / ceiling) * plotH;
  const GAP = 1; // 1px each side of a seam -> 2px total surface gap between segments

  return (
    <div style={{ position: "relative" }} ref={wrapRef}>
      <div className="legend">
        {d.datasets.map((s, si) => (<div className="legend-item" key={s.label}><span className="swatch" style={{ background: s.backgroundColor || `var(--chart-${si + 1})` }} />{s.label}</div>))}
      </div>
      <svg viewBox={`0 0 ${width} ${height}`} width="100%">
        <g transform={`translate(${marginLeft},${marginTop})`}>
          {Array.from({ length: gridSteps + 1 }).map((_, i) => {
            const v = (ceiling / gridSteps) * i, y = yFor(v);
            return (<g key={i}><line x1={0} x2={plotW} y1={y} y2={y} className="gridline-el" /><text x={-8} y={y} textAnchor="end" dominantBaseline="middle" className="axis-label">{fmtCompact(v)}</text></g>);
          })}
          <line x1={0} x2={plotW} y1={plotH} y2={plotH} className="baseline-el" />
          {d.labels.map((label, gi) => {
            const gx = gi * groupW + (groupW - barW) / 2;
            let stackTop = 0;
            const isHover = hover === gi;
            return (
              <g key={label}>
                {d.datasets.map((ds, si) => {
                  const v = ds.data[gi] || 0;
                  let yTop = yFor(stackTop + v), yBottom = yFor(stackTop);
                  stackTop += v;
                  if (si < d.datasets.length - 1) yTop += GAP;
                  if (si > 0) yBottom -= GAP;
                  const h = Math.max(yBottom - yTop, 0);
                  const isTop = si === d.datasets.length - 1;
                  return isTop
                    ? <path key={ds.label} d={topRoundedRectPath(gx, yTop, barW, h, 4)} fill={ds.backgroundColor || `var(--chart-${si + 1})`} opacity={isHover ? 1 : 0.92}
                        onMouseEnter={() => setHover(gi)} onMouseLeave={() => setHover(null)} />
                    : <rect key={ds.label} x={gx} y={yTop} width={barW} height={h} fill={ds.backgroundColor || `var(--chart-${si + 1})`} opacity={isHover ? 1 : 0.92}
                        onMouseEnter={() => setHover(gi)} onMouseLeave={() => setHover(null)} />;
                })}
                <text x={gx + barW / 2} y={plotH + 16} textAnchor="middle" className="axis-label">{label}</text>
              </g>
            );
          })}
        </g>
      </svg>
      {hover !== null && (
        <div className="chart-tooltip" style={{ left: marginLeft + (hover + 0.5) * groupW - 70, top: 6 }}>
          <div className="t-title">{d.labels[hover]}</div>
          {d.datasets.map(ds => (<div className="t-row" key={ds.label}><span>{ds.label}</span><span className="v">{fmtValue(ds.data[hover], "number")}</span></div>))}
        </div>
      )}
    </div>
  );
}

// shared by LineChart and AreaChart: a categorical x-axis, N series, and a
// crosshair+tooltip hit-column per index -- see dataviz skill's interaction spec
function XYChart({ d, mode }) {
  const [hover, setHover] = useState(null);
  const wrapRef = useRef(null);
  const width = mode === "area" ? 900 : 620, height = 240;
  const marginLeft = 54, marginRight = 10, marginTop = 10, marginBottom = 26;
  const plotW = width - marginLeft - marginRight, plotH = height - marginTop - marginBottom;
  const n = d.labels.length;
  const xFor = i => (n <= 1 ? 0 : (i / (n - 1)) * plotW);

  let series;
  if (mode === "area" && d.stacked) {
    let running = new Array(n).fill(0);
    series = d.datasets.map(ds => {
      const base = running.slice();
      running = running.map((v, i) => v + (ds.data[i] || 0));
      return { ds, base, top: running.slice() };
    });
  } else {
    series = d.datasets.map(ds => ({ ds, base: new Array(n).fill(0), top: ds.data }));
  }
  const maxVal = Math.max(1, ...series.flatMap(s => s.top));
  const ceiling = niceMax(maxVal, 4);
  const gridSteps = 4;
  const yFor = v => plotH - (v / ceiling) * plotH;
  const colW = n > 1 ? plotW / (n - 1) : plotW;

  return (
    <div style={{ position: "relative" }} ref={wrapRef}>
      {series.length > 1 && (
        <div className="legend">
          {series.map((s, si) => (<div className="legend-item" key={s.ds.label}><span className="swatch" style={{ background: s.ds.borderColor || `var(--chart-${si + 1})` }} />{s.ds.label}</div>))}
        </div>
      )}
      <svg viewBox={`0 0 ${width} ${height}`} width="100%">
        <g transform={`translate(${marginLeft},${marginTop})`}>
          {Array.from({ length: gridSteps + 1 }).map((_, i) => {
            const v = (ceiling / gridSteps) * i, y = yFor(v);
            return (<g key={i}><line x1={0} x2={plotW} y1={y} y2={y} className="gridline-el" /><text x={-8} y={y} textAnchor="end" dominantBaseline="middle" className="axis-label">{fmtCompact(v)}</text></g>);
          })}
          <line x1={0} x2={plotW} y1={plotH} y2={plotH} className="baseline-el" />
          {hover !== null && <line x1={xFor(hover)} x2={xFor(hover)} y1={0} y2={plotH} className="crosshair-el" />}

          {series.map((s, si) => {
            const color = s.ds.borderColor || `var(--chart-${si + 1})`;
            const topPath = d.labels.map((_, i) => `${i === 0 ? "M" : "L"}${xFor(i)},${yFor(s.top[i])}`).join(" ");
            const areaPath = mode === "area"
              ? topPath + " " + d.labels.map((_, i) => `L${xFor(n - 1 - i)},${yFor(s.base[n - 1 - i])}`).join(" ") + " Z"
              : null;
            return (
              <g key={s.ds.label}>
                {mode === "area" && <path d={areaPath} fill={s.ds.backgroundColor || color} opacity={s.ds.backgroundColor ? 1 : 0.12} />}
                <path d={topPath} fill="none" stroke={color} strokeWidth={2} strokeLinejoin="round" strokeLinecap="round" />
                {[0, n - 1].map(i => (
                  <circle key={"end" + i} cx={xFor(i)} cy={yFor(s.top[i])} r={5} fill={color} stroke="var(--surface)" strokeWidth={2.5} />
                ))}
                {hover !== null && <circle cx={xFor(hover)} cy={yFor(s.top[hover])} r={5} fill={color} stroke="var(--surface)" strokeWidth={2.5} />}
              </g>
            );
          })}

          {/* invisible hit column per index, wide enough for an easy hover target */}
          {d.labels.map((_, i) => (
            <rect key={i} x={xFor(i) - colW / 2} y={0} width={colW} height={plotH} fill="transparent"
              onMouseEnter={() => setHover(i)} onMouseLeave={() => setHover(null)} style={{ cursor: "crosshair" }} />
          ))}
          {d.labels.map((label, i) => (
            (n <= 10 || i % Math.ceil(n / 8) === 0) && <text key={label} x={xFor(i)} y={plotH + 14} textAnchor="middle" className="axis-label">{label}</text>
          ))}
        </g>
      </svg>
      {hover !== null && (
        <div className="chart-tooltip" style={{ left: Math.min(marginLeft + xFor(hover) - 60, width - 190), top: 6 }}>
          <div className="t-title">{d.labels[hover]}</div>
          {series.map(s => (<div className="t-row" key={s.ds.label}><span>{s.ds.label}</span><span className="v">{fmtValue(s.top[hover], "number")}</span></div>))}
        </div>
      )}
    </div>
  );
}

function Table({ d }) {
  const numFormats = new Set(["number", "currency", "percent"]);
  return (
    <div className="table-scroll">
      <table>
        <thead>
          <tr>{d.columns.map(c => (<th key={c.key} className={numFormats.has(c.format) ? "num" : ""}>{c.label}</th>))}</tr>
        </thead>
        <tbody>
          {d.rows.map((row, ri) => (
            <tr key={ri}>
              {d.columns.map(c => (<td key={c.key} className={numFormats.has(c.format) ? "num" : ""}>{fmtValue(row[c.key], c.format)}</td>))}
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

const BODY_BY_TYPE = {
  gauge: Gauge, pie: Donut, bar: GroupedBar, stacked_bar: StackedBar,
  line: ({ d }) => <XYChart d={d} mode="line" />, area: ({ d }) => <XYChart d={d} mode="area" />,
  table: Table,
};

function Widget({ widget }) {
  const d = widget.data;
  if (d.type === "stat_card") return <StatCard d={d} />;

  const Body = BODY_BY_TYPE[d.type];
  const sub = widgetSubtitle(d);
  return (
    <div className="card">
      <div className="card-head"><h2>{d.title}</h2><span className="schema-tag">{d.type}</span></div>
      {sub && <p className="card-sub">{sub}</p>}
      {Body ? <Body d={d} /> : <p className="card-sub">Unknown widget type "{d.type}"</p>}
    </div>
  );
}

function useConfig(url) {
  const [state, setState] = useState({ status: "loading", config: null, error: null });
  useEffect(() => {
    fetch(url).then(r => {
      if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
      return r.json();
    }).then(config => setState({ status: "ready", config, error: null }))
      .catch(err => setState({ status: "error", config: null, error: String(err) }));
  }, [url]);
  return state;
}

function App() {
  const { status, config, error } = useConfig(CONFIG_URL);
  const rows = config ? packRows(config.widgets) : [];

  return (
    <div>
      <div className="head">
        <div>
          <div className="head-title"><h1>{config ? config.title : "Dashboard Template"}</h1><span className="live-dot" /></div>
          {config && config.subtitle && <p className="head-sub">{config.subtitle}</p>}
        </div>
        <div className="head-meta">
          {config && config.meta && config.meta.generated_at && <div>ข้อมูล ณ {config.meta.generated_at.slice(0, 10)}</div>}
          <div><code>{CONFIG_URL}</code></div>
        </div>
      </div>

      {status === "loading" && <div className="loading"><span className="spinner" /> Loading…</div>}
      {status === "error" && <div className="error-box">Failed to load config: {error}</div>}
      {status === "ready" && rows.map((row, ri) => (
        <div className={`widget-row row-cols-${row.cols}`} key={ri}>
          {row.items.map((w, wi) => <Widget widget={w} key={wi} />)}
        </div>
      ))}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
