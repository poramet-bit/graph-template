<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<title>Template Demo</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  body { font-family: sans-serif; background:#111; color:#eee; padding:24px; }
  .grid { display:grid; grid-template-columns: 1fr 1fr; gap:24px; max-width:1000px; margin:auto; }
  .card { background:#1b1b1b; border-radius:8px; padding:16px; }
  h2 { font-size:14px; margin:0 0 12px; color:#aaa; }
  table { width:100%; border-collapse: collapse; font-size:13px; }
  th, td { border-bottom:1px solid #333; padding:6px 8px; text-align:left; }
</style>
</head>
<body>
  <div class="grid">
    <div class="card"><h2 id="t-pie"></h2><canvas id="pie"></canvas></div>
    <div class="card"><h2 id="t-bar"></h2><canvas id="bar"></canvas></div>
    <div class="card"><h2 id="t-line"></h2><canvas id="line"></canvas></div>
    <div class="card"><h2 id="t-table"></h2><table id="table"></table></div>
  </div>

<script>
async function load(name) {
  const res = await fetch(`../../templates/examples/${name}.example.json`);
  return res.json();
}

async function drawChart(name, canvasId, chartType, titleId) {
  const tpl = await load(name);
  document.getElementById(titleId).textContent = tpl.title;
  new Chart(document.getElementById(canvasId), {
    type: chartType,
    data: { labels: tpl.labels, datasets: tpl.datasets },
    options: { plugins: { legend: { labels: { color: '#eee' } } },
      scales: chartType === 'pie' ? {} : {
        x: { ticks: { color: '#aaa' } },
        y: { ticks: { color: '#aaa' } }
      }
    }
  });
}

async function drawTable() {
  const tpl = await load('table');
  document.getElementById('t-table').textContent = tpl.title;
  const table = document.getElementById('table');
  const thead = '<tr>' + tpl.columns.map(c => `<th>${c.label}</th>`).join('') + '</tr>';
  const rows = tpl.rows.map(r =>
    '<tr>' + tpl.columns.map(c => `<td>${r[c.key]}</td>`).join('') + '</tr>'
  ).join('');
  table.innerHTML = thead + rows;
}

drawChart('pie_chart', 'pie', 'pie', 't-pie');
drawChart('bar_chart', 'bar', 'bar', 't-bar');
drawChart('line_chart', 'line', 'line', 't-line');
drawTable();
</script>
</body>
</html>
